# =====================================================
# SIGUBA - backend
# Los valores de abajo son los de desarrollo local.
# En Docker se sobreescriben con variables SPRING_* (docker-compose.yml).
# =====================================================

spring.application.name=siguba-backend
server.port=8080

# ---- SQL Server -----------------------------------------------------------
# Por defecto apunta al contenedor sqlserver publicado en el host (puerto 1434).
spring.datasource.url=jdbc:sqlserver://localhost:1434;databaseName=MDMQ_SIGUBA;encrypt=true;trustServerCertificate=true
spring.datasource.username=siguba
spring.datasource.password=Siguba_Dev123*
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- HikariCP -------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=siguba-pool
spring.datasource.hikari.auto-commit=true

# ---- JPA ------------------------------------------------------------------
# 'none': el esquema lo crea BACKEND/docker/initdb/01-schema.sql, no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Jackson --------------------------------------------------------------
spring.jackson.time-zone=America/Guayaquil
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ---- Seguridad ------------------------------------------------------------
# Clave de firma de los JWT. Minimo 32 caracteres (HS256).
# En Docker se sobreescribe con APP_JWT_SECRET; en produccion es obligatorio
# poner una propia y no dejar este valor de desarrollo.
app.jwt.secret=${APP_JWT_SECRET:clave-de-desarrollo-siguba-cambiar-en-produccion}
app.jwt.expiration-minutes=480

# Origenes permitidos para llamar a la API desde otro puerto (ng serve).
app.cors.allowed-origins=http://localhost:4200

# ---- Almacen de archivos (MinIO) ------------------------------------------
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:siguba}
minio.secret-key=${MINIO_SECRET_KEY:Siguba_Minio123*}
minio.bucket=${MINIO_BUCKET:siguba}
# URL con la que el navegador alcanza MinIO, no la de la red interna de Docker.
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

# Limites de subida (el servicio ademas valida tipo y tamano).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
