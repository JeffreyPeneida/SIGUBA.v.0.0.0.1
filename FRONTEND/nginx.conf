server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # El SPA usa rutas de Angular: cualquier path desconocido cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea: es lo unico que sabe que bundle toca cargar.
    # Sin esto el navegador se queda con un index viejo y sigue pidiendo el
    # bundle anterior despues de cada despliegue, aunque el servidor ya tenga
    # el nuevo.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Lo demas lleva hash en el nombre, asi que puede cachearse para siempre:
    # si cambia el contenido, cambia el nombre.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # El frontend llama a /api/... en su propio origen y nginx lo reenvia al
    # backend. Asi no hace falta CORS ni URLs con puerto embebidas en el build.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
